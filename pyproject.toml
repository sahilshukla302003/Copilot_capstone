[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdlc-pipeline"
version = "0.1.0"
description = "Agentic SDLC pipeline driven by GitHub Copilot"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<6", "psutil>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/csv_summary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
